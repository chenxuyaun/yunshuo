name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # 这个名字被 main 的分支保护钉成必需状态检查（context 必须是 "Typecheck and test"）。
    # 改名会让这条检查永远不出现，所有 PR 都合不进去——加步骤可以，别改这里的 name。
    name: Typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: yunshuo
          POSTGRES_PASSWORD: yunshuo
          POSTGRES_DB: yunshuo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yunshuo -d yunshuo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://yunshuo:yunshuo@localhost:5432/yunshuo_test
      TEST_DATABASE_URL: postgres://yunshuo:yunshuo@localhost:5432/yunshuo_test
      NODE_ENV: test
      DEV_AUTH: "1"
      MAIL_MODE: memory
      AUTOMATION_RUNNER: "0"
      SESSION_SECRET: ci-session-secret-not-for-production
      MODEL_KEY_SECRET: ci-model-key-secret-not-for-production

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Seed test database
        run: pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Endpoint coverage gate
        run: pnpm check:endpoints

      - name: Error code coverage gate
        run: pnpm check:error-codes

      - name: Schema drift gate
        run: pnpm check:schema-drift

      - name: Test
        run: pnpm test

  docker-build:
    # 两个 Dockerfile 的 deps 层都是手工枚举的 workspace 清单（COPY 每个包的 package.json）。
    # 新增一个包却忘了补一行时，构建会在 pnpm install --frozen-lockfile 处失败，
    # 而 verify 任务不构建镜像，这个错要等部署才暴露。这里只构建、不推送，也刻意不依赖 verify：
    # 构建信号与测试结果无关。要让它拦合并，还得把它的 context 加进分支保护的必需检查列表。
    name: Docker build (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 用 buildx 的 GitHub Actions 缓存后端，两个镜像各占一个 scope，避免互相覆盖层缓存。
      # 缓存只影响耗时：命中时秒级复用 deps 层，未命中（首次运行、缓存被淘汰）退化为全量构建，
      # 结论不变。仓库级缓存配额 10 GiB，超了按 LRU 淘汰，不需要人工清理。
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          tags: yunshuo-api:ci
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          tags: yunshuo-web:ci
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
