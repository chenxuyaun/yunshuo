name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: yunshuo
          POSTGRES_PASSWORD: yunshuo
          POSTGRES_DB: yunshuo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yunshuo -d yunshuo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://yunshuo:yunshuo@localhost:5432/yunshuo_test
      TEST_DATABASE_URL: postgres://yunshuo:yunshuo@localhost:5432/yunshuo_test
      NODE_ENV: test
      DEV_AUTH: "1"
      MAIL_MODE: memory
      AUTOMATION_RUNNER: "0"
      SESSION_SECRET: ci-session-secret-not-for-production
      MODEL_KEY_SECRET: ci-model-key-secret-not-for-production

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Seed test database
        run: pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
